name: Sync from source

# 这个仓库（ok-hacking-update）不是手写的：它由「源仓库某个 tag」按 deploy.txt
# 自动同步而来。同步逻辑放在这里，是为了不需要跨仓库写权限（PAT / GitHub App）。
# 源仓库 TieLaa/ok-hacking 公开后，本 workflow 匿名就能读它。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "源仓库的 tag（留空 = 自动取最新 v*）"
        required: false
  schedule:
    - cron: "17 3 * * *"   # 每天 03:17 UTC（北京时间 11:17）

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(curl -fsSL "https://api.github.com/repos/TieLaa/ok-hacking/tags?per_page=1" \
                  | python3 -c "import json,sys; data=json.load(sys.stdin); print(data[0]['name'] if data else '')")
          fi
          if [ -z "$tag" ]; then
            echo "no tag found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out source at tag
        uses: actions/checkout@v4
        with:
          repository: TieLaa/ok-hacking
          ref: ${{ steps.tag.outputs.tag }}
          path: src

      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: dst
          # checkout 默认只拉 1 层历史，推 cnb 时会被拒（shallow update not allowed）
          fetch-depth: 0

      - name: Copy deploy.txt entries
        run: |
          set -euo pipefail
          cd src
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | tr -d '\r')"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            if [ -e "$line" ]; then
              mkdir -p "../dst/$(dirname "$line")"
              cp -a "$line" ../dst/
              echo "copied: $line"
            else
              echo "skip (source 里没有): $line"
            fi
          done < deploy.txt
          cp .update_repo_gitignore ../dst/.gitignore

      - name: Stamp version from tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # 源仓库 CI 的 stamp 只改了它自己的工作区，没进这个仓库；
          # launcher 虽然会用 pyappify.app_version 注入，但 config.py 不能是 dev。
          sed -i -E "s/^version = \"[^\"]*\"/version = \"${TAG#v}\"/" dst/src/config.py
          grep -n '^version' dst/src/config.py

      - name: Commit and tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd dst
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no content change"
          else
            git commit -m "sync $TAG"
          fi
          git tag -f "$TAG"
          git push origin HEAD:main
          git push -f origin "refs/tags/$TAG"

      # 国内更新源：China profile 的 git_url 指向 cnb.cool 上的同名镜像。
      # 纯事件驱动，没有定时抓取：GitHub 这边一推完就顺带把 main + tags 推过去。
      # 令牌是 cnb 的访问令牌（用户名固定 cnb），存在本仓库 Actions secrets 的 CNB_TOKEN。
      - name: Mirror to CNB (cnb.cool)
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::CNB_TOKEN 未配置，国内更新源不会更新"
            exit 1
          fi
          cd dst
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/TieLaa/ok-hacking-update.git"
          git push cnb "HEAD:refs/heads/main" --force
          git push cnb --tags --force
