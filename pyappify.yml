name: "ok-hacking"   # 英文，会用作安装包名：ok-hacking-win32-<profile>-setup.exe
uac: true            # 游戏进程是管理员权限，非管理员进程发不进输入
icon: "icons/icon.png"
website: "https://github.com/TieLaa/ok-hacking"

profiles:
  - name: "China"
    # 国内直接用 cnb.cool 镜像，避免 launcher 装/更新时连 github.com
    git_url: "https://cnb.cool/TieLaa/ok-hacking-update.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    # requirements.txt 是完整锁定文件，靠 --no-deps 控制依赖集合
    pip_args: "--no-deps --index-url https://mirrors.aliyun.com/pypi/simple"
    use_pythonw: true
    show_add_defender: true

  - name: "Global"
    git_url: "https://github.com/TieLaa/ok-hacking-update.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true
